<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tear</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0c0d10;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app-container {
      position: fixed;
      inset: 0;
    }
    #app-container canvas {
      display: block;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0c0d10;
      z-index: 50;
      transition: opacity 0.9s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-seam {
      width: 120px;
      height: 120px;
    }
    #loading-label {
      margin-top: 18px;
      color: #8a8f99;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    #desktop-hint {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      color: rgba(220, 224, 230, 0.55);
      font-size: 12px;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.6;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      transition: opacity 1.5s ease;
    }
    #desktop-hint.faded {
      opacity: 0.15;
    }

    /* Positions the official three.js VRButton just above the desktop hint
       instead of its default bottom-center placement colliding with it. */
    #app-container > button {
      bottom: 90px !important;
    }
  </style>
</head>
<body>
  <div id="app-container"></div>

  <div id="loading-screen">
    <svg id="loading-seam" viewBox="0 0 120 120">
      <path id="seam-path" d="M60 10 Q 55 40 65 55 Q 50 70 60 110"
        fill="none" stroke="#ffb463" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.6s" repeatCount="indefinite" />
      </path>
    </svg>
    <div id="loading-label">tearing open&hellip;</div>
  </div>

  <div id="desktop-hint">
    mouse: right hand (hold click to pinch) &nbsp;&middot;&nbsp; wheel: depth<br/>
    WASD/Q/E: left hand &nbsp;&middot;&nbsp; space: pinch &nbsp;&middot;&nbsp; &larr;&rarr; look &nbsp;&middot;&nbsp; &uarr;&darr; walk
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
